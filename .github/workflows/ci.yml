name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run security:verify

  # Windows-first product: run Rust gates on windows-latest so Tauri native
  # deps (glib/gtk) are not required on Ubuntu.
  rust-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run security:verify
      - name: Tauri Windows build smoke
        shell: bash
        run: npm run tauri build -- --bundles nsis
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-build
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/CC-Switch-Doctor.exe
            src-tauri/target/release/cc-switch-doctor.exe
          if-no-files-found: warn
