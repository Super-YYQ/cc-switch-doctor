name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run security:verify

  # Windows-first product: run Rust gates on windows-latest so Tauri native
  # deps (glib/gtk) are not required on Ubuntu.
  rust-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run security:verify
      - name: Tauri Windows build smoke
        shell: bash
        run: npm run tauri build -- --bundles nsis
      - name: Upload CI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ci-build
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/CC-Switch-Doctor.exe
            src-tauri/target/release/cc-switch-doctor.exe
          if-no-files-found: warn
