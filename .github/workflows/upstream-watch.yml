name: Upstream Watch

on:
  schedule:
    # daily ~08:17 UTC (avoid :00/:30)
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare CC Switch latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ensure label exists (idempotent)
          gh label create upstream-change \
            --color 8250df \
            --description "CC Switch upstream compatibility review" \
            --force || true

          OBSERVED=$(jq -r '.ccSwitch.latestObservedRelease' compatibility/manifest.json)
          VERIFIED=$(jq -r '.ccSwitch.latestVerifiedRelease // .ccSwitch.verifiedReleases[0]' compatibility/manifest.json)
          LATEST=$(gh api repos/farion1231/cc-switch/releases/latest --jq '.tag_name' | sed 's/^v//')
          PUBLISHED=$(gh api repos/farion1231/cc-switch/releases/latest --jq '.published_at')
          URL=$(gh api repos/farion1231/cc-switch/releases/latest --jq '.html_url')
          echo "manifest_observed=$OBSERVED verified=$VERIFIED latest=$LATEST"

          if [ "$LATEST" = "$OBSERVED" ]; then
            echo "No upstream version change."
            exit 0
          fi

          TITLE="upstream-change: CC Switch v${LATEST}"

          # Dedup by exact title + open state (do not rely solely on labels)
          EXISTING=$(gh issue list \
            --state open \
            --search "in:title upstream-change: CC Switch v${LATEST}" \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open for $TITLE"
            exit 0
          fi

          # Also skip if a closed issue for the same exact title already exists
          # (same version is not re-opened unless manifest rolls back / manual special trigger)
          CLOSED=$(gh issue list \
            --state closed \
            --search "in:title upstream-change: CC Switch v${LATEST}" \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")
          if [ -n "$CLOSED" ]; then
            echo "Issue #$CLOSED already exists (closed) for $TITLE; not recreating"
            exit 0
          fi

          BODY=$(cat <<EOF
          ## Upstream CC Switch change detected

          | Field | Value |
          | --- | --- |
          | Manifest observed | \`${OBSERVED}\` |
          | Doctor verified | \`${VERIFIED}\` |
          | Latest release | \`${LATEST}\` |
          | Published | ${PUBLISHED} |
          | Link | ${URL} |

          ### Checklist (do not auto-verify)
          - [ ] Read release notes
          - [ ] Diff \`database/schema.rs\` / \`SCHEMA_VERSION\`
          - [ ] Diff provider credential extraction paths
          - [ ] Update fixtures + \`compatibility/manifest.json\`
          - [ ] Bump \`latestObservedRelease\` after monitoring; bump \`latestVerifiedRelease\` only after manual validation
          - [ ] Run cargo tests + security gates
          - [ ] Decide verified vs compatible only after manual validation

          ### Recreate policy
          Same upstream version will **not** open a second issue after close, unless the manifest is rolled back or a maintainer re-runs with a manual special process.

          This workflow never marks a release as verified and never publishes Doctor.
          EOF
          )
          gh issue create --title "$TITLE" --label "upstream-change" --body "$BODY"
