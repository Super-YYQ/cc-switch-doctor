name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Quality gate
        shell: bash
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run security:verify

      - name: Optional code signing cert
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", $bytes)
          echo "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP/cert.pfx" >> $env:GITHUB_ENV

      - name: Tauri build
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: Package portable + checksums
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exeCandidates = @(
            "src-tauri/target/release/CC-Switch-Doctor.exe",
            "src-tauri/target/release/cc-switch-doctor.exe"
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found" }

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "NSIS setup not found" }
          $setupName = "CC-Switch-Doctor-v$V-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path $out $setupName)

          & powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version $V -ExePath $exe -OutDir $out
          & powershell -ExecutionPolicy Bypass -File scripts/generate-checksums.ps1 -AssetsDir $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CC Switch Doctor v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## CC Switch Doctor v${{ steps.ver.outputs.version }}

            Read-only, stateless, pure-HTTP diagnostics for CC Switch third-party providers.

            ### Security boundaries
            - Never launches Codex / Claude / OpenCode / Gemini CLI / CC Switch
            - Never reads `.codex` / `.claude` / OpenCode / Gemini login dirs
            - CC Switch database is **read-only**
            - Full API keys stay in Rust memory only
            - Same-origin automatic URL variants; cross-host redirects blocked

            ### Compatibility baseline
            - CC Switch **v3.17.0** (schema user_version **15**)
            - See `compatibility/manifest.json`

            ### Assets
            - `CC-Switch-Doctor-v${{ steps.ver.outputs.version }}-Windows-x64-setup.exe`
            - `CC-Switch-Doctor-v${{ steps.ver.outputs.version }}-Windows-x64-portable.zip`
            - `SHA256SUMS.txt`

            ### Code signing
            This build is **unsigned** unless a certificate was configured in repository secrets.
            Windows SmartScreen may warn on first launch for unsigned builds. Choose "More info" → "Run anyway" if you trust the checksums.

            ### Checksums
            Verify downloads against `SHA256SUMS.txt`.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify assets via API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          # wait a moment for consistency
          sleep 3
          assets=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.size)"')
          echo "$assets"
          echo "$assets" | grep -q "CC-Switch-Doctor-v${V}-Windows-x64-setup.exe"
          echo "$assets" | grep -q "CC-Switch-Doctor-v${V}-Windows-x64-portable.zip"
          echo "$assets" | grep -q "SHA256SUMS.txt"
          # sizes > 0
          while read -r name size; do
            if [ "${size:-0}" -le 0 ]; then
              echo "Asset $name has non-positive size"
              exit 1
            fi
          done <<< "$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.size)"')"
