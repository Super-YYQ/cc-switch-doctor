name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (must match package sources, e.g. 0.1.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be x.y.z, got: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite of existing tag/release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
              echo "Tag $TAG already exists on origin; refusing overwrite"
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; refusing overwrite"
              exit 1
            fi
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (MSVC)
        shell: pwsh
        run: |
          # Windows product builds require the MSVC toolchain (not gnu/mingw).
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable-x86_64-pc-windows-msvc --profile minimal -c rustfmt,clippy
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify release version consistency
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/verify-release-version.mjs --expected "${{ steps.ver.outputs.version }}"

      - name: Quality gate
        shell: bash
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run security:verify

      - name: Tauri build (unsigned)
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: Package portable + checksums
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exeCandidates = @(
            "src-tauri/target/release/CC-Switch-Doctor.exe",
            "src-tauri/target/release/cc-switch-doctor.exe"
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found" }

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "NSIS setup not found" }
          $setupName = "CC-Switch-Doctor-v$V-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path $out $setupName)

          & powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version $V -ExePath $exe -OutDir $out
          & powershell -ExecutionPolicy Bypass -File scripts/generate-checksums.ps1 -AssetsDir $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CC Switch Doctor v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## CC Switch Doctor v${{ steps.ver.outputs.version }}

            Read-only, stateless, pure-HTTP diagnostics for CC Switch third-party providers.

            ### Highlights
            - Shared per-host request budget (30) across the whole diagnosis session
            - In-session request result reuse (memory cache; no full API keys stored)
            - OpenAI Chat `max_completion_tokens` → `max_tokens` compatibility fallback
            - Refresh / re-scan fully clears selection and previous diagnosis state
            - Distinguish CC Switch latest observed vs Doctor-verified versions
            - Upstream Watch deduplicates open issues by exact title
            - GitHub Actions pinned to full commit SHAs

            ### Security boundaries
            - Never launches Codex / Claude / OpenCode / Gemini CLI / CC Switch
            - Never reads `.codex` / `.claude` / OpenCode / Gemini login dirs
            - CC Switch database is **read-only**
            - Full API keys stay in Rust memory only
            - Same-origin automatic URL variants; cross-host redirects blocked

            ### Compatibility baseline
            - CC Switch **v3.17.0** (schema user_version **15**)
            - See `compatibility/manifest.json` (`latestVerifiedRelease`)

            ### Assets
            - `CC-Switch-Doctor-v${{ steps.ver.outputs.version }}-Windows-x64-setup.exe`
            - `CC-Switch-Doctor-v${{ steps.ver.outputs.version }}-Windows-x64-portable.zip`
            - `SHA256SUMS.txt`

            ### Code signing
            **This release is unsigned.**
            Windows SmartScreen may warn on first launch. Choose "More info" → "Run anyway" if you trust the checksums.

            ### Checksums
            Verify downloads against `SHA256SUMS.txt`.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify assets via API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          sleep 3
          assets=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.size)"')
          echo "$assets"
          echo "$assets" | grep -q "CC-Switch-Doctor-v${V}-Windows-x64-setup.exe"
          echo "$assets" | grep -q "CC-Switch-Doctor-v${V}-Windows-x64-portable.zip"
          echo "$assets" | grep -q "SHA256SUMS.txt"
          while read -r name size; do
            if [ "${size:-0}" -le 0 ]; then
              echo "Asset $name has non-positive size"
              exit 1
            fi
          done <<< "$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.size)"')"
