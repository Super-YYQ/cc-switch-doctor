[package]
name = "cc-switch-doctor"
version = "0.1.9"
description = "Read-only, stateless, pure-HTTP diagnostic tool for CC Switch third-party providers"
authors = ["Super-YYQ"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Super-YYQ/cc-switch-doctor"
rust-version = "1.77"

[lib]
name = "cc_switch_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = { version = "2", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-util = "0.3"
bytes = "1"
regex = "1"
once_cell = "1"
toml = "0.8"
base64 = "0.22"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
pretty_assertions = "1"
httpmock = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
